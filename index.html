<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swan</title>

<script src="https://unpkg.com/lucide@latest"></script>

<style>
:root {
  --blue-dark:#0f3557;
  --blue:#2f80ed;
}

body {
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(#e4f3ff, white);
  text-align:center;
  color:#1f2937;
}

/* HEADER */
header {
  background:linear-gradient(135deg,#0b2a46,#0f3557);
  color:white;
  padding:40px 20px 35px;
  border-radius:0 0 35px 35px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
  position: relative;
}

/* LANGUE */
.lang-top {
  position:absolute;
  top:15px;
  right:15px;
}

.lang-top button {
  background:transparent;
  border:1px solid rgba(255,255,255,0.7);
  color:white;
  padding:6px 10px;
  border-radius:10px;
  margin-left:5px;
  cursor:pointer;
  font-weight:bold;
}

.lang-top button:hover {
  background:white;
  color:#0f3557;
}

/* LOGO */
.logo {
  width:200px;
  margin-bottom:20px;
  filter: drop-shadow(0 6px 15px rgba(0,0,0,0.4));
}

/* ADRESSE */
.address {
  font-size:18px;
  font-weight:600;
  line-height:1.6;
}

.address span {
  display:block;
  font-size:22px;
  font-weight:700;
}

/* BOUTON */
.btn {
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-top:20px;
  padding:14px 22px;
  background:var(--blue);
  color:white;
  border-radius:18px;
  text-decoration:none;
  font-weight:bold;
  box-shadow:0 6px 18px rgba(47,128,237,0.4);
}

/* MENU */
.menu {
  margin-top:35px;
}

.menu a {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin:15px auto;
  padding:18px;
  width:85%;
  max-width:340px;
  background:white;
  color:#0f3557;
  border-radius:20px;
  text-decoration:none;
  font-weight:bold;
  box-shadow:0 6px 20px rgba(0,0,0,0.1);
}

.menu i {
  color:var(--blue);
}

.en { display:none; }
</style>
</head>

<body>

<header>

  <!-- LANG -->
  <div class="lang-top">
    <button onclick="setLang('fr')">FR</button>
    <button onclick="setLang('en')">EN</button>
  </div>

  <!-- LOGO -->
  <img src="img/logo-swan.png" class="logo">

  <!-- ADRESSE -->
  <div class="address">
    <span>17 avenue de Belgique</span>
    06220 Vallauris<br>
    4ème étage – Porte 139
  </div>

  <!-- GOOGLE MAPS -->
  <a class="btn" target="_blank"
     href="https://www.google.com/maps/search/?api=1&query=17+avenue+de+Belgique+06220+Vallauris">
    <i data-lucide="map-pin"></i>
    <span class="fr">Itinéraire Google Maps</span>
    <span class="en">Open in Google Maps</span>
  </a>

</header>

<!-- MENU -->
<div class="menu">

  <a href="acces.html">
    <i data-lucide="key"></i>
    <span class="fr">Accès appartement</span>
    <span class="en">Apartment access</span>
  </a>

  <a href="wifi.html">
    <i data-lucide="wifi"></i>
    <span class="fr">WiFi</span>
    <span class="en">WiFi</span>
  </a>

</div>

<script>
function setLang(lang) {
  document.querySelectorAll('.fr').forEach(el => {
    el.style.display = lang === 'fr' ? 'inline' : 'none';
  });

  document.querySelectorAll('.en').forEach(el => {
    el.style.display = lang === 'en' ? 'inline' : 'none';
  });

  document.documentElement.lang = lang;
}

lucide.createIcons();
</script>

</body>
</html>
