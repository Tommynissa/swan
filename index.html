<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swan</title>

<script src="https://unpkg.com/lucide@latest"></script>

<style>
:root {
  --blue-dark:#0f3557;
  --blue:#2f80ed;
}

body {
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(#e4f3ff, white);
  text-align:center;
  color:#1f2937;
}

/* HEADER PREMIUM */
header {
  background:linear-gradient(135deg,#0b2a46,#0f3557);
  color:white;
  padding:40px 20px 35px;
  border-radius:0 0 35px 35px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

/* LOGO */
.logo {
  width:200px;
  margin-bottom:20px;
  filter: drop-shadow(0 6px 15px rgba(0,0,0,0.4));
}

/* ADRESSE PREMIUM */
.address {
  font-size:18px;
  font-weight:600;
  line-height:1.6;
  margin-top:10px;
}

.address span {
  display:block;
  font-size:22px;
  font-weight:700;
}

/* BOUTON MAPS */
.btn {
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-top:20px;
  padding:14px 22px;
  background:var(--blue);
  color:white;
  border-radius:18px;
  text-decoration:none;
  font-weight:bold;
  box-shadow:0 6px 18px rgba(47,128,237,0.4);
  transition:0.2s;
}

.btn:hover {
  transform:translateY(-2px);
}

/* MENU */
.menu {
  margin-top:35px;
}

.menu a {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin:15px auto;
  padding:18px;
  width:85%;
  max-width:340px;
  background:white;
  color:var(--blue-dark);
  border-radius:20px;
  text-decoration:none;
  font-weight:bold;
  box-shadow:0 6px 20px rgba(0,0,0,0.1);
  transition:0.2s;
}

.menu a:hover {
  transform:translateY(-3px);
}

/* ICONES */
.menu i {
  color:var(--blue);
}
</style>
</head>

<body>

<header>

  <!-- LOGO -->
  <img src="img/logo-swan.png" class="logo" alt="Logo Swan">

  <!-- ADRESSE -->
  <div class="address">
    <span>17 avenue de Belgique</span>
    06220 Vallauris<br>
    4ème étage – Porte 139
  </div>

  <!-- GOOGLE MAPS -->
  <a class="btn" target="_blank"
     href="https://www.google.com/maps/search/?api=1&query=17+avenue+de+Belgique+06220+Vallauris">
    <i data-lucide="map-pin"></i>
    Itinéraire Google Maps
  </a>

</header>

<!-- MENU -->
<div class="menu">

  <a href="acces.html">
    <i data-lucide="key"></i>
    Accès appartement
  </a>

  <a href="wifi.html">
    <i data-lucide="wifi"></i>
    WiFi
  </a>

</div>

<script>
lucide.createIcons();
</script>

</body>
</html>
