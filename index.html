<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accès Appartement - Vallauris</title>

  <style>
    :root {
      --blue-dark: #123c69;
      --blue: #2f80ed;
      --blue-light: #dff1ff;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, var(--blue-light), white);
    }

    header {
      background: var(--blue-dark);
      color: white;
      padding: 30px;
      text-align: center;
      border-radius: 0 0 30px 30px;
    }

    .btn {
      display: inline-block;
      background: var(--blue);
      color: white;
      padding: 12px 18px;
      border-radius: 16px;
      text-decoration: none;
      margin-top: 10px;
    }

    .lang button {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 10px;
      border: none;
    }

    .card {
      background: white;
      margin: 20px;
      padding: 20px;
      border-radius: 20px;
    }

    .real-photo {
      width: 100%;
      border-radius: 15px;
      margin: 10px 0;
    }

    .caption {
      background: #eef6ff;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .en { display:none; }
  </style>
</head>

<body>

<header>
  <h1 class="fr">Accès à l’appartement</h1>
  <h1 class="en">Apartment Access</h1>

  <p>17 avenue de Belgique, 06220 Vallauris</p>

  <a class="btn" target="_blank"
     href="https://www.google.com/maps/search/?api=1&query=17+avenue+de+Belgique+06220+Vallauris">
    📍 Google Maps
  </a>

  <div class="lang">
    <button onclick="setLang('fr')">FR</button>
    <button onclick="setLang('en')">EN</button>
  </div>
</header>

<main>

<section class="card">
<h2 class="fr">Arrivée</h2>
<h2 class="en">Arrival</h2>

<img src="img/entree.jpg" class="real-photo">
<img src="img/entree-badge.jpg" class="real-photo">
<p class="caption fr">Ouvrez avec le badge</p>
<p class="caption en">Open with badge</p>

<img src="img/ascenseur.jpg" class="real-photo">
<p class="caption fr">Prenez l’ascenseur</p>
<p class="caption en">Take the elevator</p>

<img src="img/porte-appartement.jpg" class="real-photo">
<p class="caption fr">Sortie : droite puis 1ère porte à gauche n°139</p>
<p class="caption en">Exit: right then first door left n°139</p>

</section>

</main>

<script>
function setLang(lang){
 document.querySelectorAll('.fr').forEach(e=>e.style.display=lang==='fr'?'block':'none');
 document.querySelectorAll('.en').forEach(e=>e.style.display=lang==='en'?'block':'none');
}
</script>

</body>
</html>
