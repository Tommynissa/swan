<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WiFi - Swan</title>

<script src="https://unpkg.com/lucide@latest"></script>

<style>
:root {
  --blue-dark:#0f3557;
  --blue:#2f80ed;
  --blue-light:#e4f3ff;
  --soft:#f6fbff;
}

body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: linear-gradient(#e4f3ff, white);
  color: #1f2937;
}

header {
  background: #0f3557;
  color: white;
  padding: 25px;
  text-align: center;
  border-radius: 0 0 28px 28px;
  position: relative;
}

.lang-top {
  position:absolute;
  top:15px;
  right:15px;
}

.lang-top button {
  background:transparent;
  border:1px solid rgba(255,255,255,0.7);
  color:white;
  padding:6px 10px;
  border-radius:10px;
  margin-left:5px;
  cursor:pointer;
  font-weight:bold;
}

.lang-top button:hover {
  background:white;
  color:#0f3557;
}

header a {
  color:white;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:10px;
  font-weight:bold;
}

main {
  max-width: 720px;
  margin: 25px auto;
  padding: 0 18px 40px;
}

.card {
  background:white;
  padding:24px;
  border-radius:24px;
  box-shadow:0 8px 25px rgba(15,53,87,0.12);
  text-align:center;
}

.card h2 {
  color:var(--blue-dark);
  margin-top:0;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
}

.wifi-box {
  background:var(--soft);
  border:1px solid #d8ebff;
  border-radius:22px;
  padding:18px;
  margin-top:18px;
  text-align:left;
}

.wifi-line {
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:14px 0;
  border-bottom:1px solid #dbeeff;
  flex-wrap:wrap;
}

.wifi-line:last-child {
  border-bottom:none;
}

.wifi-value {
  font-weight:bold;
  color:var(--blue-dark);
  word-break:break-all;
}

.btn {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  margin-top:18px;
  padding:14px 18px;
  background:var(--blue);
  color:white;
  border:none;
  border-radius:18px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 6px 18px rgba(47,128,237,0.35);
}

.note {
  margin-top:18px;
  background:#f6fbff;
  border-left:4px solid var(--blue);
  padding:13px 14px;
  border-radius:14px;
  line-height:1.5;
  text-align:left;
}

.en { display:none; }
</style>
</head>

<body>

<header>

  <div class="lang-top">
    <button onclick="setLang('fr')">FR</button>
    <button onclick="setLang('en')">EN</button>
  </div>

  <h1>
    <i data-lucide="wifi"></i>
    <span class="fr">WiFi</span>
    <span class="en">WiFi</span>
  </h1>

  <a href="index.html">
    <i data-lucide="arrow-left"></i>
    <span class="fr">Retour à l’accueil</span>
    <span class="en">Back</span>
  </a>

</header>

<main>

<section class="card">
  <h2>
    <i data-lucide="router"></i>
    <span class="fr">Connexion WiFi</span>
    <span class="en">WiFi connection</span>
  </h2>

  <p class="fr">
    Vous pouvez vous connecter au réseau WiFi avec les informations ci-dessous.
  </p>

  <p class="en">
    You can connect to the WiFi network using the information below.
  </p>

  <div class="wifi-box">
    <div class="wifi-line">
      <span class="fr">Nom du réseau</span>
      <span class="en">Network name</span>
      <span class="wifi-value">Bbox-AF2149FF</span>
    </div>

    <div class="wifi-line">
      <span class="fr">Mot de passe</span>
      <span class="en">Password</span>
      <span class="wifi-value" id="wifiPassword">4jMA1MPEuexKFxvnLn</span>
    </div>
  </div>

  <button class="btn" onclick="copyWifi()">
    <i data-lucide="copy"></i>
    <span class="fr">Copier le mot de passe</span>
    <span class="en">Copy password</span>
  </button>

  
</section>

</main>

<script>
function setLang(lang) {
  document.querySelectorAll('.fr').forEach(el => {
    el.style.display = lang === 'fr' ? 'block' : 'none';
  });

  document.querySelectorAll('.en').forEach(el => {
    el.style.display = lang === 'en' ? 'block' : 'none';
  });

  document.documentElement.lang = lang;
}

function copyWifi() {
  const password = document.getElementById('wifiPassword').innerText;
  navigator.clipboard.writeText(password).then(() => {
    alert(document.documentElement.lang === 'en'
      ? 'WiFi password copied!'
      : 'Mot de passe WiFi copié !');
  });
}

lucide.createIcons();
</script>

</body>
</html>
